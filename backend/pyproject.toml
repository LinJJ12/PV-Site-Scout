[project]
name = "pv-site-scout-backend"
version = "1.0.0"
description = "光伏选址预测 API（Flask）"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "flask-cors>=4.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3,<1.8",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "requests>=2.31",
]

[dependency-groups]
# 离线数据处理脚本（fetch / calc）
scripts = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "tqdm>=4.66",
]
# 可选：启用 GAT 推理时再装（体积大、耗时长）
torch = [
  "torch>=2.0",
  "torch-geometric>=2.4",
]

[tool.uv]
package = false

[tool.uv.sources]
# 默认不装 torch；需要时：uv sync --group torch
